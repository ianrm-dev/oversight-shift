<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Oversight Shift — situation diagrams</title>
    <link rel="icon" href="data:," />
    <style>
      body { margin: 0; padding: 16px; background: var(--bg); color: var(--text); font-family: var(--font-ui); }
      .g-card { margin: 0 0 18px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
      .g-card h2 { margin: 0 0 6px; font-size: 14px; font-family: var(--font-mono); }
      .g-card small { color: var(--text-3); font-family: var(--font-ui); font-weight: 400; }
      .g-row { display: grid; grid-template-columns: repeat(4, 780px); gap: 12px; }
      figure { margin: 0; padding: 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface-2); width: 780px; box-sizing: border-box; }
      figcaption { font-size: 10px; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.08em; }
    </style>
  </head>
  <body>
    <div id="gallery"></div>
    <script type="module" src="./diagrams.ts"></script>
  </body>
</html>
